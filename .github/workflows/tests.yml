name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

permissions:
  contents: read

jobs:
  validate:
    name: Lint & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Repository validation (manifest, changelog, syntax)
        run: python scripts/ci_validate.py

      - name: Flake8 (syntax and critical errors only)
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --exclude=.git,__pycache__,.venv,venv \
            --show-source \
            --statistics

      - name: Flake8 (style warnings, non-blocking)
        continue-on-error: true
        run: |
          flake8 . \
            --count \
            --max-line-length=120 \
            --exclude=.git,__pycache__,.venv,venv,scripts/ci_validate.py \
            --extend-ignore=E501,W503 \
            --statistics

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check internal markdown links (basic)
        continue-on-error: true
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          root = Path('.')
          missing = []
          link_re = re.compile(r'\]\(([^)]+)\)')
          for md in root.rglob('*.md'):
              if '.git' in md.parts:
                  continue
              text = md.read_text(encoding='utf-8', errors='ignore')
              base = md.parent
              for target in link_re.findall(text):
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  path = (base / target.split('#')[0]).resolve()
                  try:
                      path.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if target.split('#')[0] and not path.exists():
                      missing.append('%s -> %s' % (md, target))
          if missing:
              print('WARN: possible broken relative links:')
              for m in missing[:30]:
                  print(' ', m)
              if len(missing) > 30:
                  print('  ... and', len(missing) - 30, 'more')
          else:
              print('OK: no obvious broken relative markdown links')
          PY
